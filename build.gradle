plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	// "main" holds common + server code, "client" holds rendering/GUI/keybinds.
	// Client classes can see main classes, never the other way around, so a
	// dedicated server can never load a client-only class by accident.
	splitEnvironmentSourceSets()

	mods {
		"chunkclaims" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game checks driven by Fabric's client gametest API: src/gametest, run with
	// ./gradlew runClientGameTest. The singleplayer tests need no server EULA; the
	// dedicated-server test only runs with -PacceptMinecraftEula (see below).
	configureTests {
		createSourceSet = true
		modId = "chunkclaims-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

// A dedicated server will not start until its EULA is accepted. Passing
// -PacceptMinecraftEula means you accept https://aka.ms/MinecraftEULA, and lets
// DedicatedServerGameTest write eula=true for its local test server.
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	if (project.hasProperty("acceptMinecraftEula")) {
		jvmArgs "-Dchunkclaims.gametest.acceptEula=true"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit for the Minecraft-free core (claims, clusters, pricing, storage).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}
